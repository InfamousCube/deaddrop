<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dead Drop</title>
<meta name="theme-color" content="#07060a">
<link rel="manifest" href="manifest.webmanifest">
<style>
  @font-face { font-family: 'DDBodoniI'; src: url('fonts/BodoniModa-Italic.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'DDJost'; src: url('fonts/Jost.woff2') format('woff2'); font-display: swap; }
  :root { --ink: #07060a; --gold: #d9a93a; --gold-hi: #fff1c2; --red: #b3121b; --paper: #efe3c4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; color: var(--paper); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(120% 90% at 50% 110%, #3a0508 0%, #12040a 45%, var(--ink) 75%);
    transition: opacity .6s ease, visibility .6s;
  }
  #overlay.hidden, html.autoxr #overlay { opacity: 0; visibility: hidden; pointer-events: none; }
  .card { width: min(560px, 100%); text-align: center; }
  .top { font: 500 12px/1 'DDJost', sans-serif; letter-spacing: .5em; color: rgba(239,227,196,.62); margin-left: .5em; }
  h1 {
    margin: 18px 0 8px; font: italic 600 clamp(56px, 13vw, 104px)/.95 'DDBodoniI', serif; letter-spacing: -.01em;
    background: linear-gradient(180deg, var(--gold-hi) 8%, var(--gold) 46%, #7a5a1c 78%, #f0cf7a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .wire { position: relative; height: 2px; margin: 18px auto 22px; width: 72%; background: rgba(217,169,58,.18); overflow: hidden; }
  .wire::after { content: ''; position: absolute; inset: 0; width: 34%; background: linear-gradient(90deg, transparent, var(--gold-hi), var(--gold), transparent); animation: run 2.6s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes run { from { transform: translateX(-110%); } to { transform: translateX(310%); } }
  .sub { font: 400 15px/1.6 'DDJost', sans-serif; color: rgba(239,227,196,.78); margin: 0 auto 30px; max-width: 34em; }
  .sub b { color: var(--paper); font-weight: 500; }
  #enter {
    appearance: none; border: 1.5px solid var(--gold); background: transparent; color: var(--gold-hi);
    font: 500 15px/1 'DDJost', sans-serif; letter-spacing: .42em; padding: 20px 46px 20px calc(46px + .42em);
    border-radius: 999px; cursor: pointer; transition: background .25s, color .25s, transform .15s;
  }
  #enter:hover:not(:disabled) { background: var(--gold); color: var(--ink); }
  #enter:active:not(:disabled) { transform: scale(.97); }
  #enter:disabled { opacity: .45; cursor: default; }
  #status { min-height: 1.4em; margin-top: 18px; font: 400 12px/1.4 'DDJost', sans-serif; letter-spacing: .14em; color: rgba(239,227,196,.5); text-transform: uppercase; }
  .stamp { display: inline-block; margin-top: 30px; padding: 6px 14px; border: 2px solid rgba(179,18,27,.8); color: rgba(220,60,60,.9); font: 500 11px/1 'DDJost', sans-serif; letter-spacing: .4em; transform: rotate(-4deg); }
</style>
<script>
  if (location.search.includes('autoxr') || /OculusBrowser|Quest|Pacific|Monterey|Hollywood|Seacliff|Eureka|Panther/i.test(navigator.userAgent)) {
    document.documentElement.classList.add('autoxr');
  }
</script>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div class="card">
    <div class="top">LISTENING STATION · MODEL 7</div>
    <h1>Dead Drop</h1>
    <div class="wire"></div>
    <p class="sub" id="hint">Pick a tape and hold it to hear its best part. <b>Drop it into the deck</b> and the song takes the room. Hold <b>B</b> or <b>Y</b> to come back.</p>
    <button id="enter" disabled>LOADING</button>
    <div id="status"></div>
    <div class="stamp">EYES ONLY</div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
